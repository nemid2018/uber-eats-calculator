<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uber Eats Merchant Profit Calculator</title>
    <meta name="description" content="Calculate your restaurant's profitability on Uber Eats. Compare plans, set your costs, and see exactly how much you'd earn — step by step." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Uber Eats Merchant Profit Calculator" />
    <meta property="og:description" content="Calculate your restaurant's profitability on Uber Eats. Compare plans, set your costs, and see exactly how much you'd earn — step by step." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Uber Eats Merchant Profit Calculator" />
    <meta name="twitter:description" content="Calculate your restaurant's profitability on Uber Eats. Compare plans, set your costs, and see exactly how much you'd earn — step by step." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // When deployed to a subpath (e.g. GitHub Pages /uber-eats-calculator/),
      // strip the prefix so React Router's path="/" route matches correctly.
      (function () {
        var base = '/uber-eats-calculator';
        var p = window.location.pathname;
        if (p === base || p.startsWith(base + '/')) {
          var rest = p.slice(base.length) || '/';
          window.history.replaceState(null, '', rest + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
